# ──────────────────────────────────────────────────────
# DocuIntel AI — CI Pipeline
# ──────────────────────────────────────────────────────
# Lightweight: installs only what Phase 1 tests need,
# not the full ML stack from requirements-phase0.txt.
# ──────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Phase 1 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic-settings httpx
          pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
