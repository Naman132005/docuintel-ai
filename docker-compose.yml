# ──────────────────────────────────────────────
# DocuIntel AI — Docker Compose
# ──────────────────────────────────────────────
# Prerequisites:
#   1. Copy .env.example to .env and set your values:
#        copy .env.example .env      (Windows)
#        cp .env.example .env        (Linux/macOS)
#   2. Start services:
#        docker compose up -d
#   3. Stop services:
#        docker compose down
# ──────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    container_name: docuintel_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-docuintel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - docuintel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuintel} -d ${POSTGRES_DB:-docuintel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  docuintel_pgdata:
    driver: local
